<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>

  <body>
    <input type="text" name="location" id="location-input" />
    <button id="submit-button">Get forecast</button>

    <div class="location">
      <h1 class="location__title"></h1>
    </div>

    <div class="alerts" id="alerts"></div>

    <div class="grid">
      <div class="current-main card">
        <div class="current-range">
          <div class="current-high">
            <span class="current-high__arrow">↑</span>
            <p class="current-high__temp" id="current-high"></p>
          </div>

          <div class="current-low">
            <span class="current-low__arrow">↓</span>
            <p class="current-low__temp" id="current-low"></p>
          </div>
        </div>

        <h3 class="current-main__temp" id="current-temp"></h3>
        <p class="current-main__conditions" id="current-conditions"></p>
      </div>

      <div class="feels-like card">
        <p class="feels-like__temp" id="current-feels-like"></p>
      </div>

      <div class="humidity card">
        <p class="humidity__percent" id="current-humidity"></p>
      </div>

      <div class="uv card">
        <p class="uv__measure" id="current-uv"></p>
      </div>

      <div class="hourly card">
        <div class="hourly__hours" id="hours"></div>
      </div>

      <div class="forecast card">
        <h2 class="forecast__title">14-day forecast</h2>
        <div class="forecast__days">
          <div class="day"></div>
        </div>
      </div>
    </div>
  </body>
</html>
