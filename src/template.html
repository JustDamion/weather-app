<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="icon" href="./images/sun-wireless.svg" />
  </head>

  <body>
    <header>
      <label class="location-label" for="location-input">Location:</label>
      <input
        class="location-input"
        type="text"
        name="location"
        id="location-input"
        placeholder="San Francisco, California"
      />
      <button class="submit-button" id="submit-button" type="button">Get forecast</button>
      <input class="unit-toggle" type="checkbox" name="unit" id="unit-toggle" />
    </header>

    <div class="loading" id="loading"></div>

    <div class="location" id="location">
    </div>

    <div class="alerts" id="alerts"></div>

    <div class="grid">
      <div class="current-main card" id="current-main">
        <div class="current-range">
          <div class="current-high" id="current-high">
            <span class="current-high__arrow">↑</span>
          </div>

          <div class="current-low" id="current-low">
            <span class="current-low__arrow">↓</span>
          </div>
        </div>
      </div>

      <div class="feels-like card" id="current-feels-like">
        <h3>Feels like</h3>
      </div>

      <div class="humidity card" id="current-humidity">
        <h3>Humidity</h3>
      </div>

      <div class="uv card" id="current-uv">
        <h3>UV Index</h3>
      </div>

      <div class="wind card" id="current-wind">
        <h3>Wind Speed</h3>
      </div>

      <div class="precipitation card" id="current-precipitation">
        <h3>Precipitation Chance</h3>
      </div>

      <div class="sunset card" id="current-sunset">
        <h3>Sunset</h3>
      </div>

      <div class="hourly card">
        <div class="hourly__hours" id="hours"></div>
      </div>

      <div class="forecast card" id="forecast">
        <table class="forecast__table">
          <caption class="forecast__title">
            14-day forecast
          </caption>
          <thead>
            <tr class="day">
              <th scope="col">Day</th>
              <th scope="col">Conditions</th>
              <th scope="col">Humidity</th>
              <th scope="col">Precipitation Chance</th>
              <th scope="col">Wind Speed</th>
              <th scope="col">Low</th>
              <th scope="col">High</th>
            </tr>
          </thead>

          <tbody class="forecast__days" id="forecast-days"></tbody>
        </table>
      </div>
    </div>
  </body>
</html>
