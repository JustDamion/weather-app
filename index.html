<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Weather App</title><link rel="icon" href="46573d031c2b6ef790f0.svg"/><script defer="defer" src="main.js"></script></head><body><header><label class="location-label" for="location-input">Location:</label> <input class="location-input" name="location" id="location-input" placeholder="San Francisco, California"/> <button class="submit-button" id="submit-button">Get forecast</button> <input class="unit-toggle" type="checkbox" name="unit" id="unit-toggle"/></header><div class="loading" id="loading"></div><div class="location"><h1 class="location__title" id="location-title"></h1></div><div class="alerts" id="alerts"></div><div class="grid"><div class="current-main card"><div class="current-range"><div class="current-high"><span class="current-high__arrow">↑</span><p class="current-high__temp" id="current-high"></p></div><div class="current-low"><span class="current-low__arrow">↓</span><p class="current-low__temp" id="current-low"></p></div></div><h3 class="current-main__temp" id="current-temp"></h3><p class="current-main__conditions" id="current-conditions"></p></div><div class="feels-like card"><h3>Feels like</h3><p class="feels-like__temp" id="current-feels-like"></p></div><div class="humidity card"><h3>Humidity</h3><p class="humidity__percent" id="current-humidity"></p></div><div class="uv card"><h3>UV Index</h3><p class="uv__measure" id="current-uv"></p></div><div class="wind card"><h3>Wind Speed</h3><p class="wind__speed" id="current-wind"></p></div><div class="precipitation card"><h3>Precipitation Chance</h3><p class="precipitation__chance" id="current-precipitation-chance"></p></div><div class="sunset card"><h3>Sunset</h3><p class="sunset__time" id="current-sunset-time"></p></div><div class="hourly card"><div class="hourly__hours" id="hours"></div></div><div class="forecast card" id="forecast"><table class="forecast__table"><caption class="forecast__title">14-day forecast</caption><thead><tr class="day"><th scope="col">Day</th><th scope="col">Conditions</th><th scope="col">Humidity</th><th scope="col">Precipitation Chance</th><th scope="col">Wind Speed</th><th scope="col">Low</th><th scope="col">High</th></tr></thead><tbody class="forecast__days" id="forecast-days"></tbody></table></div></div></body></html>
